[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rulforge"
version = "0.1.0"
description = "Explainable predictive maintenance on NASA C-MAPSS"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scikit-learn", "xgboost", "torch",
  "shap", "pyyaml", "matplotlib", "seaborn", "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "nbstripout", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
